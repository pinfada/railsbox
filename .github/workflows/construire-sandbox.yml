# Construit la sandbox railsbox d'une application Rails et la publie sur le
# gh-pages de SON dépôt.
#
# Workflow réutilisable : un mainteneur l'appelle depuis son propre dépôt, et
# obtient une démonstration jouable dans le navigateur, sans serveur.
#
#   jobs:
#     sandbox:
#       uses: pinfada/railsbox/.github/workflows/construire-sandbox.yml@main
#       permissions:
#         contents: write
#
# Répartition (ADR 0004) : le rootfs mutualisé est tiré du dépôt d'artefacts de
# railsbox, la coquille et le disque applicatif sont publiés côte à côte sur le
# gh-pages du mainteneur. Une origine par démonstration, donc une isolation
# assurée par le navigateur plutôt que promise par nous.
name: Construire la sandbox

on:
  workflow_call:
    inputs:
      app-path:
        description: "Chemin de l'application Rails dans le dépôt appelant"
        type: string
        default: "."
      name:
        description: "Nom court de la sandbox (défaut : nom du dépôt)"
        type: string
        default: ""
      base:
        description: >-
          Version de la base railsbox à utiliser. Le défaut convient à
          sqlite3 comme à PostgreSQL ; « 3.3 » (sans PostgreSQL) reste
          publiée pour les sandboxes qui l'épinglent, et la construction
          refuse explicitement une base trop ancienne pour l'application.
        type: string
        default: "3.3-r2"
      assets-url:
        description: "Racine du dépôt d'artefacts railsbox"
        type: string
        default: "https://pinfada.github.io/railsbox-assets"
      base-image:
        description: "Image de construction (doit correspondre à `base`)"
        type: string
        default: "ghcr.io/pinfada/railsbox-base"
      railsbox-repo:
        description: >-
          Dépôt railsbox à utiliser. Un contributeur qui modifie la coquille
          ou le proxy y met son fork pour vérifier son changement de bout en
          bout — sans quoi la seule vérification qui ait jamais trouvé les
          défauts de publication resterait réservée au mainteneur.
        type: string
        default: "pinfada/railsbox"
      railsbox-ref:
        description: "Version de railsbox utilisée pour construire"
        type: string
        default: "main"
      seed:
        description: "Commande de seed (vide = celle détectée)"
        type: string
        default: ""
      publish:
        description: "Publier sur gh-pages (sinon construction seule)"
        type: boolean
        default: true
      target-repo:
        description: >-
          Dépôt où publier la sandbox, si ce n'est pas celui qui appelle.
          Exige alors le secret publish-key (clé de déploiement en écriture),
          le jeton du workflow ne valant que pour le dépôt courant.
        type: string
        default: ""
    secrets:
      publish-key:
        description: "Clé de déploiement en écriture sur target-repo"
        required: false

# Limite de GitHub Pages : 95 Mo par fichier. Le rootfs, le disque applicatif
# ET l'instantané mémoire sont découpés en morceaux de CHUNK_BYTES (ADR 0003) :
# plus aucun artefact de la VM ne peut buter sur cette limite. Ce qui la
# dépasserait encore vient de l'application, et on le refuse explicitement
# plutôt que de publier une démonstration qui échouerait au chargement.
env:
  CHUNK_BYTES: 4194304
  MAX_FILE_BYTES: 99614720
  # L'étage amd64 de précompilation des assets s'appuie sur deux capacités de
  # BuildKit : le contexte de build nommé (--build-context) et la sortie locale
  # (--output). Le runner l'active par défaut ; on ne le laisse pas au hasard.
  DOCKER_BUILDKIT: 1

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    # Les entrées de l'appelant ne s'interpolent JAMAIS directement dans un
    # bloc run : elles transitent par l'environnement, où le shell les traite
    # comme des données. En workflow_call le dommage serait auto-infligé
    # (runner et jeton de l'appelant), mais la discipline coûte peu.
    env:
      IN_NOM: ${{ inputs.name }}
      IN_BASE: ${{ inputs.base }}
      IN_ASSETS_URL: ${{ inputs.assets-url }}
      IN_BASE_IMAGE: ${{ inputs.base-image }}
      IN_APP_PATH: ${{ inputs.app-path }}
      IN_SEED: ${{ inputs.seed }}
      IN_TARGET_REPO: ${{ inputs.target-repo }}
    steps:
      # ------------------------------------------------------------------
      # Dépôt privé publiant sur lui-même : le mode de panne le plus cher du
      # projet, parce que RIEN n'échoue. La construction va au bout, gh-pages
      # est poussée, le récapitulatif donne une adresse — et cette adresse
      # répond 404, GitHub Pages n'étant pas ouvert aux dépôts privés d'un
      # plan gratuit. Le mainteneur croit avoir fini. C'est arrivé le
      # 19/08/2026, après neuf minutes de runner FACTURÉES : un dépôt privé
      # ne consomme pas les minutes gratuites.
      #
      # On avertit, on ne refuse pas. Sur un plan Pro, Team ou Enterprise,
      # Pages fonctionne depuis un dépôt privé — le site publié devient
      # simplement public. Un refus sec casserait ces mainteneurs-là pour
      # protéger les autres. Et l'avertissement tombe AVANT la première étape
      # coûteuse : sa raison d'être est d'épargner les neuf minutes, pas de
      # les commenter après coup.
      # ------------------------------------------------------------------
      - name: Destination de la publication
        if: ${{ inputs.publish && inputs.target-repo == '' }}
        env:
          # Renseigné par tout déclencheur dont la charge utile webhook porte
          # le dépôt — `push` et `workflow_dispatch`, les deux chemins que la
          # documentation propose, mais aussi pull_request ou release. La
          # valeur arrive ici en TEXTE : « true », « false », ou vide quand la
          # charge utile ne porte pas de dépôt. Et le vide n'est pas « public » :
          # le prendre pour tel rendrait la garde silencieuse là où elle est le
          # plus utile, d'où le repli ci-dessous qui demande au dépôt lui-même.
          PRIVE_EVENEMENT: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          prive="${PRIVE_EVENEMENT:-}"
          # Repli sur l'API du dépôt. Il fonctionne malgré le bloc
          # `permissions:` réduit à `contents: write` : « metadata » est le
          # seul scope que GitHub accorde toujours, quoi que le job déclare —
          # contrairement à « pages », dont le récapitulatif fait les frais.
          # Muet s'il échoue : une visibilité inconnue ne doit produire AUCUN
          # message, ni rassurant ni alarmant.
          if [ -z "$prive" ]; then
            prive="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private' 2>/dev/null || true)"
          fi
          [ "$prive" = "true" ] || exit 0

          echo "::warning title=Dépôt privé publiant sur lui-même::Sur un plan gratuit, GitHub Pages n'est pas disponible pour un dépôt privé : la branche gh-pages sera poussée, puis l'adresse répondra 404, sans message nulle part. Le chemin prévu est une vitrine publique (entrée target-repo + secret publish-key). Voir le récapitulatif de cette exécution."
          {
            echo "### Ce dépôt est privé, et publie sur lui-même"
            echo ""
            echo "La construction continue — elle est légitime sur un plan payant."
            echo "Mais sur un plan **gratuit**, GitHub Pages n'est pas disponible pour"
            echo "un dépôt privé : la branche \`gh-pages\` sera bien poussée, et"
            echo "l'adresse répondra **404**. Sans message d'erreur, nulle part."
            echo ""
            echo "| Votre plan | Ce qui se passe |"
            echo "|---|---|"
            echo "| Pro, Team, Enterprise | Pages fonctionne. Le site publié est public, le code reste privé. Rien à changer. |"
            echo "| Gratuit | L'adresse restera morte. Publiez sur une vitrine publique. |"
            echo ""
            echo "Une vitrine, c'est un second dépôt — public, vide — qui n'héberge que"
            echo "la sandbox. Elle s'amorce depuis votre machine, sans cloner railsbox :"
            echo ""
            echo '```sh'
            echo "curl -fsSL -o amorcer-vitrine.sh https://raw.githubusercontent.com/pinfada/railsbox/main/tools/amorcer-vitrine.sh"
            echo "sh amorcer-vitrine.sh ${GITHUB_REPOSITORY} ${GITHUB_REPOSITORY}-demo"
            echo '```'
            echo ""
            echo "Le script crée le dépôt, y active Pages sur \`gh-pages\`, pose la clé de"
            echo "déploiement et écrit le secret. Il reste ensuite à renseigner"
            echo "\`target-repo\` (et \`publish-key\`) dans l'appel de ce workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Récupération de l'application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: application

      - name: Récupération de railsbox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.railsbox-repo }}
          ref: ${{ inputs.railsbox-ref }}
          path: railsbox

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: railsbox/package-lock.json
      - run: npm ci
        working-directory: railsbox

      - name: Paramètres de la construction
        id: parametres
        run: |
          nom="$IN_NOM"
          [ -n "$nom" ] || nom="${GITHUB_REPOSITORY##*/}"
          # Assaini dans TOUS les cas : le nom finit dans des chemins, des
          # messages de commit et le résumé — jamais tel que fourni.
          nom="$(printf '%s' "$nom" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_-' '-')"
          # Assainies AU MÊME TITRE que le nom, et pour une raison plus grave :
          # ces valeurs sont ECRITES DANS LE FICHIER D'ENVIRONNEMENT du job.
          # Une entrée porteuse d'un saut de ligne y définissait la variable de
          # son choix — dans un job qui porte contents:write et le secret de
          # publication. « tr -c » remplace tout ce qui sort du jeu autorisé,
          # sauts de ligne compris : une seule ligne en sort, toujours.
          base="$(printf '%s' "$IN_BASE" | tr -c 'a-zA-Z0-9._-' '-')"
          assets="$(printf '%s' "$IN_ASSETS_URL" | tr -c 'a-zA-Z0-9._:/-' '-')"
          # Via GITHUB_ENV et non GITHUB_OUTPUT : les étapes suivantes lisent
          # des variables d'environnement, jamais une interpolation d'entrée
          # dans le texte de leur script.
          echo "SB_NOM=$nom" >> "$GITHUB_ENV"
          echo "SB_VERSION_BASE=$base" >> "$GITHUB_ENV"
          echo "SB_ASSETS=$assets" >> "$GITHUB_ENV"
          echo "SB_BASE=base-${base}" >> "$GITHUB_ENV"
          echo "SB_RACINE=${assets}/base-${base}" >> "$GITHUB_ENV"
          # Racine publique de la sandbox : « /depot » sur un Pages de projet.
          # L'application doit être montée dessus, sinon elle génère ses liens
          # et ses assets à la racine du domaine, hors du site.
          cible="$IN_TARGET_REPO"
          [ -n "$cible" ] || cible="$GITHUB_REPOSITORY"
          prefixe="$(printf '%s' "${cible##*/}" | tr -c 'a-zA-Z0-9._-' '-')"
          echo "SB_PREFIXE=/${prefixe}" >> "$GITHUB_ENV"
          # Journal de l'étape en cours : chaque étape faillible y déverse sa
          # sortie (tee), et l'étape de diagnostic le classe si le job échoue.
          # Une seule et même fiche, réécrite : seule la dernière étape compte.
          echo "SB_JOURNAL=${RUNNER_TEMP}/journal-etape.txt" >> "$GITHUB_ENV"
          echo "Sandbox « $nom » sur la base ${base}" >> "$GITHUB_STEP_SUMMARY"

      # L'analyse est de toute façon rejouée par build-app-disk.sh : elle est
      # faite ici pour le MAINTENEUR. L'étage de précompilation retenu et les
      # diagnostics doivent se lire dans le résumé de la construction, pas au
      # milieu de cinq cents lignes de journal — et un refus doit tomber avant
      # les neuf minutes de réassemblage du rootfs.
      - name: Plan de construction
        working-directory: railsbox
        run: |
          set -eu
          app="${GITHUB_WORKSPACE}/application/${IN_APP_PATH}"
          # --base : l'analyse doit connaître le Ruby que la VM exécutera pour
          # confronter la directive `ruby` du Gemfile à ce que la base fournit.
          # Sans lui, une égalité stricte (ruby "3.3.10") n'échouait qu'au
          # bundle install de app.Dockerfile — Bundler::RubyVersionMismatch,
          # plusieurs minutes après le début de la construction.
          if ! node tools/build-v86-image/manifest-to-args.mjs \
                 "$app" "$SB_NOM" --base "$SB_VERSION_BASE" > plan.env 2> plan.txt; then
            cat plan.txt >&2
            {
              echo "### Construction refusée"
              echo ""
              echo '```'
              cat plan.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat plan.txt
          # Les valeurs sont déjà entre apostrophes (manifest-to-args.mjs) :
          # sourcer ce fragment n'évalue jamais un $(commande) d'un railsbox.yml.
          . ./plan.env
          {
            echo "### Plan de construction"
            echo ""
            echo "| Élément | Valeur |"
            echo "|---|---|"
            echo "| Ruby déclaré (série, étage amd64) | $RUBY_VERSION |"
            echo "| Ruby du guest (fourni par la base) | ${BASE_RUBY_VERSION:-inconnu} |"
            echo "| Base de données | $DATABASE |"
            echo "| Précompilation des assets | \`$ASSETS_STAGE\` |"
            echo "| Outils d'assets sans binaire i386 | ${BINARY_ASSET_GEMS:-aucun} |"
            echo "| Scripts npm de build | ${ASSET_SCRIPTS:-aucun} |"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f plan.env plan.txt

      # ------------------------------------------------------------------
      # Le rootfs est RÉASSEMBLÉ depuis les octets publiés, jamais reconstruit.
      # Un ext2 refabriqué ici aurait d'autres UUID et horodatages : le delta
      # capturé dessus embarquerait un cache de blocs divergeant du disque que
      # le visiteur lira (ADR 0002). C'est la condition de la restauration.
      # ------------------------------------------------------------------
      # Toutes les étapes faillibles suivent le même gabarit : le nom de
      # l'étape est publié dans l'environnement, et la sortie est dupliquée
      # dans SB_JOURNAL par tee. C'est ce journal — et non les cinq cents
      # lignes du runner — que l'étape de diagnostic classe en cas d'échec.
      # pipefail est indispensable : sans lui, le code de retour serait celui
      # de tee, toujours nul, et un échec passerait pour un succès.
      - name: Réassemblage du rootfs de base
        working-directory: railsbox
        run: |
          set -eu
          set -o pipefail
          echo "SB_ETAPE=Réassemblage du rootfs de base" >> "$GITHUB_ENV"
          {
            racine="$SB_RACINE"
            base="$SB_BASE"
            mkdir -p public/disks
            node tools/build-v86-image/assemble-artifact.mjs \
              "${racine}/${base}.ext2.zst" --out "public/disks/${base}.ext2"
            curl -sSfL "${racine}/${base}-vmlinuz" -o "public/disks/${base}-vmlinuz"
            curl -sSfL "${racine}/${base}-initrd" -o "public/disks/${base}-initrd"
            curl -sSfL "${racine}/${base}-state.bin.gz" -o "public/disks/${base}-state.bin.gz"
            gunzip -kf "public/disks/${base}-state.bin.gz"
            ls -la public/disks
          } 2>&1 | tee "$SB_JOURNAL"

      # Le script orchestre lui-même l'étage amd64 de précompilation des assets
      # quand l'application en a besoin (Tailwind, dart-sass, chaîne npm) : le
      # runner GitHub est un amd64, ses binaires y tournent nativement, et seul
      # le résultat — public/assets — entre dans le disque i386.
      - name: Construction du disque applicatif
        working-directory: railsbox
        run: |
          set -eu
          set -o pipefail
          echo "SB_ETAPE=Construction du disque applicatif" >> "$GITHUB_ENV"
          {
            docker pull -q "${IN_BASE_IMAGE}:${SB_VERSION_BASE}"
            # Tableau et non chaîne : une commande de seed contient des espaces,
            # qu'une expansion non quotée découperait en arguments distincts.
            extra=()
            [ -z "$IN_SEED" ] || extra+=(--seed "$IN_SEED")
            sudo -E env "PATH=$PATH" bash tools/build-v86-image/build-app-disk.sh \
              "${GITHUB_WORKSPACE}/application/${IN_APP_PATH}" \
              --name "$SB_NOM" \
              --base "${IN_BASE_IMAGE}:${SB_VERSION_BASE}" \
              --mount-prefix "$SB_PREFIXE" \
              "${extra[@]}"
            sudo chown -R "$USER" public/disks
          } 2>&1 | tee "$SB_JOURNAL"

      # Boot base + application, exécution du démarrage applicatif (les seeds
      # ont déjà tourné à la construction du disque), puis gel de la mémoire.
      # L'auto-connexion, elle, s'exécute chez le visiteur : elle dépend de SA
      # session, qu'aucun instantané ne peut contenir.
      - name: Capture du delta d'instantané
        working-directory: railsbox
        run: |
          set -eu
          set -o pipefail
          echo "SB_ETAPE=Capture du delta d'instantané" >> "$GITHUB_ENV"
          {
            node tools/build-v86-image/make-delta-snapshot.mjs \
              --name "$SB_NOM" \
              --base "$SB_BASE" \
              --mount-path "${SB_PREFIXE}/app" \
              --base-url "$SB_RACINE" \
              --base-chunk-size "${CHUNK_BYTES}" \
              --app-chunk-size "${CHUNK_BYTES}" \
              --state-suffix ".gz"
          } 2>&1 | tee "$SB_JOURNAL"

      - name: Découpage des artefacts de l'application
        working-directory: railsbox
        run: |
          set -eu
          set -o pipefail
          echo "SB_ETAPE=Découpage des artefacts de l'application" >> "$GITHUB_ENV"
          {
            nom="$SB_NOM"
            config="public/disks/${nom}-split-config.json"
            # --fingerprint : les noms publiés portent l'empreinte du contenu
            # (ADR 0007). Un nom stable au contenu changeant laissait tout cache
            # resservir le morceau d'une AUTRE construction sous la même URL —
            # un instantané mémoire restauré sur le disque d'une autre image,
            # donc une VM qui ne répond jamais. --config accorde la
            # configuration aux noms réellement publiés : elle a été écrite
            # avant le découpage, et seul le découpage connaît l'empreinte.
            node tools/build-v86-image/split-artifact.mjs \
              "public/disks/${nom}-app.ext2" --zstd \
              --fingerprint --config "$config" --out publication/disks
            # L'instantané est découpé LUI AUSSI depuis 2026-08-17 (ADR 0003).
            # Gzippé d'un seul tenant il pesait le tiers du brut, ce qui suffit
            # pour la démonstration (~76 Mo) mais pas pour une application
            # lourde : la première application tierce réelle en produisait
            # 118 Mo, au-delà des 95 Mo par fichier de Pages. Le plafond de
            # l'hébergeur était devenu un plafond de mémoire utilisable. En
            # morceaux, il n'y en a plus. La coquille les réassemble (voir
            # public/shared/snapshot-parts.js) ; gzip et non zstd, parce que
            # c'est NOTRE code qui décompresse, avec DecompressionStream.
            node tools/build-v86-image/split-artifact.mjs \
              "public/disks/${nom}-split-state.bin" --gzip \
              --fingerprint --config "$config" \
              --chunk-size "${CHUNK_BYTES}" --out publication/disks
            # La configuration est copiée APRÈS les deux découpages : elle porte
            # désormais les noms versionnés qu'ils viennent de publier.
            cp "$config" publication/disks/v86-config.json

            # Assets fingerprintés extraits du disque applicatif et servis
            # STATIQUEMENT par le Service Worker : c'est le levier de performance
            # n°1, ~90 % du trafic d'un chargement de page. Sans eux, chaque
            # feuille de style traverserait le port série — quand elle arrive.
            # La racine est vide : dans le disque découplé l'arbre applicatif est
            # à la racine du système de fichiers, pas sous /app.
            sudo sh tools/extract-assets.sh \
              "public/disks/${nom}-app.ext2" publication/disks/assets ""
            sudo chown -R "$USER" publication/disks
            echo "assets extraits : $(find publication/disks/assets -type f | wc -l) fichiers"
          } 2>&1 | tee "$SB_JOURNAL"

      - name: Assemblage de la coquille
        working-directory: railsbox
        run: |
          set -eu
          set -o pipefail
          echo "SB_ETAPE=Assemblage de la coquille" >> "$GITHUB_ENV"
          {
            # Tout public/ SAUF disks/, qui contient les artefacts de travail
            # (l'ext2 de base réassemblé pèse 1,4 Go et n'a rien à faire ici).
            rsync -a --exclude 'disks/' public/ publication/
            touch publication/.nojekyll
            # La coquille du dépôt déclare `connect-src 'self'` : chez un
            # mainteneur tiers, la base est cross-origin et la CSP bloquerait
            # les XHR de v86 avant même le CORS. On autorise l'origine de la
            # base — et rien d'autre — quand elle diffère du site cible.
            cible="$IN_TARGET_REPO"
            [ -n "$cible" ] || cible="$GITHUB_REPOSITORY"
            proprietaire="$(echo "${cible%%/*}" | tr '[:upper:]' '[:lower:]')"
            node tools/build-v86-image/autoriser-origine-base.mjs \
              publication/index.html \
              --base-url "$SB_RACINE" \
              --site-origin "https://${proprietaire}.github.io"
            # README de la branche publiée. Sur une vitrine séparée — le cas
            # de tout dépôt privé — ce dépôt est la SEULE surface publique :
            # le README du dépôt source n'est visible de personne. Sans ce
            # fichier, le visiteur trouve un dépôt sans titre, sans lien et
            # sans explication, alors que c'est la page que le mainteneur
            # partage. « .nojekyll » étant posé, Pages n'en fait pas une page :
            # index.html reste ce que sert la racine du site.
            if [ -n "$IN_TARGET_REPO" ]; then
              propre_a_la_source=""
            else
              propre_a_la_source="--source-publiee"
            fi
            node tools/build-v86-image/ecrire-readme-vitrine.mjs \
              publication/README.md \
              --nom "$SB_NOM" \
              --adresse "https://${proprietaire}.github.io/${cible##*/}/" \
              --depot-source "$GITHUB_REPOSITORY" \
              $propre_a_la_source
            du -sh publication
            # Garde-fou POSITIF : les trois gros artefacts sont découpés, et
            # chacun laisse son inventaire. Un inventaire manquant signale une
            # étape sautée — défaut qui, sans cette vérification, ne se voyait
            # qu'au chargement chez le visiteur. Les noms portent l'empreinte du
            # contenu (ADR 0007), d'où les motifs : ce qu'on vérifie ici est
            # qu'une étape de découpage a eu lieu. Que la configuration nomme
            # bien CES morceaux-là est garanti en amont, le découpeur échouant
            # si aucun de ses champs ne désigne l'artefact qu'il publie.
            for inventaire in publication/disks/"${SB_NOM}"-app-*.ext2-parts.json \
                              publication/disks/"${SB_NOM}"-split-state-*.bin-parts.json; do
              if [ ! -f "$inventaire" ]; then
                echo "::error::Inventaire de morceaux absent : ${inventaire}"
                echo "Le disque applicatif et l'instantané doivent être découpés (ADR 0003)."
                exit 1
              fi
            done
            # Garde-fou de la limite Pages. Il ne peut plus s'agir d'un artefact
            # de la VM : disques et instantané sont découpés en morceaux de
            # 4 Mio. Ce qui reste au-dessus de 95 Mo est un fichier de
            # l'application elle-même (un asset précompilé, une vidéo), que rien
            # ne sait découper — v86 ne le lit pas, le navigateur le télécharge
            # tel quel. Le message dit donc ce qu'il y a à faire.
            trop_gros=$(find publication -type f -size +"$((MAX_FILE_BYTES / 1024))"k -printf '%f (%s octets)\n' || true)
            if [ -n "$trop_gros" ]; then
              echo "::error::Fichiers au-delà de la limite de 95 Mo de GitHub Pages :"
              echo "$trop_gros"
              echo "Les artefacts de la VM sont découpés en morceaux (ADR 0003) : ces"
              echo "fichiers-là viennent de l'application. Allégez-les ou servez-les"
              echo "depuis un hébergement tiers avant de reconstruire."
              exit 1
            fi
            find publication -type f | wc -l
          } 2>&1 | tee "$SB_JOURNAL"

      - name: Publication sur gh-pages
        if: ${{ inputs.publish }}
        working-directory: railsbox/publication
        env:
          PUBLISH_KEY: ${{ secrets.publish-key }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          set -o pipefail
          echo "SB_ETAPE=Publication sur gh-pages" >> "$GITHUB_ENV"
          # Le journal de cette étape peut porter le jeton dans une URL de
          # remote en erreur : contrairement à la sortie du runner, il n'est
          # pas passé au masquage des secrets. Le classifieur caviarde donc
          # l'extrait avant de l'écrire dans le résumé.
          {
            cible="$IN_TARGET_REPO"
            if [ -n "$cible" ]; then
              if [ -z "${PUBLISH_KEY:-}" ]; then
                echo "::error::target-repo exige le secret publish-key (clé de déploiement en écriture)."
                exit 1
              fi
              mkdir -p ~/.ssh && chmod 700 ~/.ssh
              printf '%s\n' "$PUBLISH_KEY" > ~/.ssh/id_ed25519
              chmod 600 ~/.ssh/id_ed25519
              ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
              distant="git@github.com:${cible}.git"
            else
              cible="$GITHUB_REPOSITORY"
              # Le jeton reste une variable d'environnement : jamais interpolé
              # dans le texte du script, ni figé dans une URL de remote que git
              # pourrait réémettre en cas d'erreur.
              distant="https://x-access-token:${GH_TOKEN}@github.com/${cible}.git"
            fi

            git init -q -b gh-pages
            git config user.email "actions@github.com"
            git config user.name "railsbox"
            git add -A
            git commit -q -m "sandbox railsbox — ${SB_NOM} (${GITHUB_SHA})"
            # Branche remise à plat : la sandbox est entièrement régénérée à
            # chaque construction, conserver l'historique n'empilerait que des
            # binaires morts.
            git push -f "$distant" gh-pages
            echo "CIBLE=$cible" >> "$GITHUB_ENV"
          } 2>&1 | tee "$SB_JOURNAL"

      # Ce que cette étape a le droit d'affirmer. Elle a vu un push réussir :
      # c'est un fait. Elle n'a vu AUCUN site répondre — un Pages non activé
      # rend un 404 muet, indiscernable d'ici. Elle titrait pourtant « Sandbox
      # publiée » et donnait l'adresse comme un résultat : le mainteneur d'un
      # dépôt privé repartait avec un lien mort en croyant avoir fini. Le fait
      # et l'hypothèse sont désormais séparés, et la vérification qui pourrait
      # les réunir est tentée — sans jamais faire échouer l'étape, ni se
      # présenter comme concluante quand elle ne l'est pas.
      - name: Récapitulatif
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cible="${CIBLE:-}"
          [ -n "$cible" ] || cible="$GITHUB_REPOSITORY"
          adresse="https://${cible%%/*}.github.io/${cible##*/}/"
          activation="gh api -X POST repos/${cible}/pages -f 'source[branch]=gh-pages' -f 'source[path]=/'"
          {
            echo "## Branche \`gh-pages\` poussée sur \`${cible}\`"
            echo ""
            echo "C'est le fait établi : les fichiers de la sandbox sont dans la branche."
            echo "L'adresse ci-dessous, elle, ne répondra que si GitHub Pages sert"
            echo "\`gh-pages\` sur ce dépôt."
            echo ""
            echo "[$adresse]($adresse)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$IN_TARGET_REPO" ]; then
            # Le jeton d'Actions ne vaut que pour le dépôt courant : la vitrine
            # a été atteinte par une clé de déploiement, qui ne donne aucun
            # accès à l'API. Tenter l'appel produirait un 403 qu'on présenterait
            # ensuite comme une information — autant dire tout de suite qu'on
            # ne sait pas, et donner le geste qui tranche.
            {
              echo "### État de GitHub Pages sur la vitrine : non vérifié"
              echo ""
              echo "Le jeton de ce workflow ne vaut que pour \`${GITHUB_REPOSITORY}\`."
              echo "railsbox n'a aucun droit de lecture sur \`${cible}\` et ne peut donc"
              echo "rien affirmer de son état. Une seule fois, depuis votre machine :"
              echo ""
              echo '```sh'
              echo "$activation"
              echo '```'
              echo ""
              echo "(\`tools/amorcer-vitrine.sh\` l'a déjà fait si vous avez amorcé la"
              echo "vitrine avec lui.)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # Vérification OPPORTUNISTE, et il faut insister sur le mot : dès
            # qu'un job déclare un bloc `permissions:`, tout scope non listé
            # tombe à `none`. Le workflow documenté ne demande que
            # `contents: write` — « pages » y vaut donc `none`, et cet appel
            # répond 403 chez TOUS les mainteneurs déjà installés. Un 403 ne
            # dit rien de l'état de Pages : il ne doit ni passer pour un
            # succès, ni faire échouer l'étape. D'où les quatre issues
            # distinctes ci-dessous, dont deux avouent l'ignorance.
            etat=0
            reponse="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.source.branch' 2>&1)" || etat=$?
            if [ "$etat" -eq 0 ]; then
              branche="$reponse"
              if [ -z "$branche" ] || [ "$branche" = "null" ]; then
                branche="(non indiquée par l'API)"
              fi
              {
                echo "### GitHub Pages est actif sur ce dépôt"
                echo ""
                echo "Branche servie : \`${branche}\`."
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "$branche" != "gh-pages" ]; then
                # Pages actif mais braqué ailleurs : le pire des cas pour qui
                # lit vite. Le site répond — avec un tout autre contenu que la
                # sandbox qu'on vient de pousser.
                echo "::warning title=GitHub Pages ne sert pas gh-pages::Pages est actif sur ${GITHUB_REPOSITORY} mais sert « ${branche} » : l'adresse répondra, sans montrer la sandbox. Rebasculez la source sur la branche gh-pages."
                {
                  echo ""
                  echo "**La sandbox vient d'être poussée sur \`gh-pages\`, pas sur cette"
                  echo "branche-là.** L'adresse répondra donc, mais montrera autre chose."
                  echo "Pour rebasculer la source :"
                  echo ""
                  echo '```sh'
                  echo "gh api -X PUT repos/${cible}/pages -f 'source[branch]=gh-pages' -f 'source[path]=/'"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            elif printf '%s' "$reponse" | grep -q 'HTTP 404'; then
              {
                echo "### Aucun site GitHub Pages sur ce dépôt"
                echo ""
                echo "L'adresse ci-dessus répond **404** tant que Pages n'est pas activé."
                echo "Depuis votre machine :"
                echo ""
                echo '```sh'
                echo "$activation"
                echo '```'
                echo ""
                echo "Ou : Settings → Pages → Source « Deploy from a branch » →"
                echo "branche \`gh-pages\`, dossier \`/ (root)\`."
                echo ""
                echo "Sur un dépôt **privé** d'un plan gratuit, l'activation elle-même"
                echo "sera refusée : passez par une vitrine publique — voir la section"
                echo "« Dépôt privé » du README de railsbox."
              } >> "$GITHUB_STEP_SUMMARY"
            elif printf '%s' "$reponse" | grep -qE 'HTTP (401|403)'; then
              {
                echo "### État de GitHub Pages : non vérifié"
                echo ""
                echo "railsbox n'a pas pu lire l'état de Pages — **ceci n'est pas un"
                echo "succès** : le site peut aussi bien être actif qu'inexistant."
                echo ""
                echo "La cause est mécanique : dès qu'un job déclare un bloc"
                echo "\`permissions:\`, tout scope absent de la liste vaut \`none\`."
                echo "Ajoutez \`pages: read\` à l'appel pour que railsbox puisse vous"
                echo "le dire à la prochaine construction :"
                echo ""
                echo '```yaml'
                echo "permissions:"
                echo "  contents: write"
                echo "  pages: read"
                echo '```'
                echo ""
                echo "En attendant, la vérification manuelle :"
                echo ""
                echo '```sh'
                echo "gh api repos/${cible}/pages"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              # Réseau, API en panne, `gh` absent d'une image de runner
              # exotique : on ne sait pas pourquoi, et on ne le déduit pas.
              {
                echo "### État de GitHub Pages : non vérifié"
                echo ""
                echo "L'appel à l'API a échoué pour une raison inattendue — **ceci n'est"
                echo "pas un succès**. La vérification manuelle :"
                echo ""
                echo '```sh'
                echo "gh api repos/${cible}/pages"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          {
            echo ""
            echo "### Le badge à coller dans votre README"
            echo ""
            echo '```markdown'
            echo "[![Try with railsbox](${adresse}badge.svg)](${adresse})"
            echo '```'
            echo ""
            echo "Le badge est servi par votre propre sandbox : aucune dépendance"
            echo "à un service de badges, et rien à maintenir."
            echo ""
            echo "Le rootfs mutualisé est servi par \`${SB_ASSETS}\` :"
            echo "le dépôt n'héberge que l'application."
          } >> "$GITHUB_STEP_SUMMARY"

      # Symétrique des refus amont : un échec en AVAL laissait le mainteneur
      # devant cinq cents lignes de journal Docker. Le classifieur en tire une
      # catégorie, l'extrait qui la prouve et un remède, et les publie dans le
      # résumé — le journal complet reste dans les traces du runner pour qui
      # veut creuser. L'extrait est caviardé : le journal capturé par tee n'a
      # pas traversé le masquage des secrets du runner.
      - name: Pourquoi la construction a échoué
        if: failure()
        working-directory: railsbox
        run: |
          set -eu
          if [ ! -s "${SB_JOURNAL:-}" ]; then
            {
              echo "### Pourquoi la construction a échoué"
              echo ""
              echo "Aucun journal d'étape n'a été capturé : l'échec précède la construction"
              echo "proprement dite (voir le rapport d'analyse ci-dessus)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node tools/build-v86-image/classifier-echec.mjs \
            --etape "${SB_ETAPE:-inconnue}" \
            --journal "$SB_JOURNAL" >> "$GITHUB_STEP_SUMMARY"
