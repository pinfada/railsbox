# Intégration continue : chaque push et pull request doit passer le lint,
# le format, le typecheck et les tests unitaires. Les artefacts VM
# (public/disks/) ne sont pas dans le dépôt : seuls les modules purs sont
# vérifiés ici — le harnais d'intégration sur VM réelle arrive en phase A1/B.
name: CI

# Dépôt public : les PR de forks ne doivent jamais obtenir un jeton en écriture.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      # Les scripts shell portent la construction entière, et rien ne les
      # relisait : actionlint ne voit que les blocs `run:` des workflows, et
      # `bash -n` accepte un « \n » littéral (c'est un argument valide). Un tel
      # « \n », introduit par une fusion, a collé trois options sur une ligne et
      # fait perdre à docker son argument de contexte — défaut trouvé par la
      # première construction d'une application tierce, pas par 519 tests.
      # shellcheck le nomme immédiatement (SC1012).
      - name: Lint (shellcheck)
        run: npm run lint:shell
      - name: Format (Prettier)
        run: npm run format:check
      - name: Typecheck (tsc --checkJs)
        run: npm run typecheck
      - name: Tests unitaires
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `--with-deps` mêle deux téléchargements fragiles dans une seule étape :
      # apt (dépendances système) et le CDN Playwright (binaire). Le pipelining
      # HTTP d'apt sur les runners provoque des blocages silencieux — une
      # exécution est restée 50 minutes sur cette étape sans une ligne de
      # journal. Les séparer, pipelining coupé, rend chaque échec visible et
      # attribuable.
      - name: Installer les dépendances système de Chromium
        run: |
          sudo apt-get update -o Acquire::http::Pipeline-Depth=0
          npx playwright install-deps chromium
      - name: Télécharger le binaire Chromium
        run: npx playwright install chromium
      - name: Tests E2E (page hôte — les specs VM s'ignorent sans artefacts)
        run: npm run test:e2e
