# Intégration continue : chaque push et pull request doit passer le lint,
# le format, le typecheck et les tests unitaires. Les artefacts VM
# (public/disks/) ne sont pas dans le dépôt : seuls les modules purs sont
# vérifiés ici — le harnais d'intégration sur VM réelle arrive en phase A1/B.
name: CI

# Dépôt public : les PR de forks ne doivent jamais obtenir un jeton en écriture.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      # Les scripts shell portent la construction entière, et rien ne les
      # relisait : actionlint ne voit que les blocs `run:` des workflows, et
      # `bash -n` accepte un « \n » littéral (c'est un argument valide). Un tel
      # « \n », introduit par une fusion, a collé trois options sur une ligne et
      # fait perdre à docker son argument de contexte — défaut trouvé par la
      # première construction d'une application tierce, pas par 519 tests.
      # shellcheck le nomme immédiatement (SC1012).
      - name: Lint (shellcheck)
        run: npm run lint:shell
      - name: Format (Prettier)
        run: npm run format:check
      - name: Typecheck (tsc --checkJs)
        run: npm run typecheck
      - name: Tests unitaires
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `--with-deps` mêle deux téléchargements fragiles dans une seule étape :
      # apt (dépendances système) et le CDN Playwright (binaire). Le pipelining
      # HTTP d'apt sur les runners provoque des blocages silencieux — une
      # exécution est restée 50 minutes sur cette étape sans une ligne de
      # journal. Les séparer, pipelining coupé, rend chaque échec visible et
      # attribuable.
      - name: Installer les dépendances système de Chromium
        run: |
          sudo apt-get update -o Acquire::http::Pipeline-Depth=0
          npx playwright install-deps chromium
      - name: Télécharger le binaire Chromium
        run: npx playwright install chromium
      - name: Tests E2E (page hôte — les specs VM s'ignorent sans artefacts)
        run: npm run test:e2e

  # Les défenses de frontière reposent EXPLICITEMENT sur des différences entre
  # moteurs : la règle de provenance a dû être réécrite parce que le premier
  # correctif ne lisait que `Sec-Fetch-Site`, absent de deux moteurs sur trois,
  # et qu'aucun test ne pouvait le voir. Un verdict rendu par Chromium seul ne
  # dit donc rien de ces frontières.
  #
  # Job séparé du `e2e` ci-dessus, et non une matrice de celui-ci : la suite
  # complète comprend un boot de VM, qui dure des minutes et n'apprend rien de
  # plus hors Chromium. Seules les épreuves listées dans
  # playwright.securite.config.mjs sont rejouées sur les trois moteurs.
  securite-moteurs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Même découpage que le job e2e : apt et le CDN Playwright sont deux
      # téléchargements fragiles, et les mêler rend leurs échecs illisibles.
      - name: Installer les dépendances système des trois moteurs
        run: |
          sudo apt-get update -o Acquire::http::Pipeline-Depth=0
          npx playwright install-deps chromium firefox webkit
      - name: Télécharger les binaires
        run: npx playwright install chromium firefox webkit
      - name: Épreuves de frontière (chromium, firefox, webkit)
        run: npm run test:securite

  # L'ÉTAGE D'ASSETS, CONSTRUIT POUR DE VRAI. Les tests purs disent quel
  # gestionnaire est retenu ; aucun ne dit que la chaîne aboutit. Entre la
  # décision et un fichier produit il y a la sérialisation en arguments de
  # build, l'activation de Corepack dans l'image, l'installation verrouillée,
  # et `jsbundling-rails` qui va lui-même chercher le gestionnaire — chacun de
  # ces maillons a cassé au moins une fois sur une application tierce.
  #
  # Job séparé parce qu'il exige Docker et quelques minutes, là où `quality`
  # doit rester en dessous de la minute. Aucune VM n'est bootée : seul l'étage
  # amd64 est ciblé.
  assets-pnpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Étage d'assets pnpm (fixture jsbundling-rails)
        run: node --test tests/integration/assets-pnpm.it.mjs
