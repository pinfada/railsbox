# Recette de la sandbox PUBLIÉE — la vérification qui regarde le produit fini,
# à son URL réelle, et non le code du dépôt.
#
# Volontairement séparée de la CI : elle dépend du réseau et d'un déploiement,
# deux choses qu'un push ne doit jamais exiger. Elle tourne à la demande (pour
# vérifier une publication qu'on vient de faire) et une fois par semaine — une
# démonstration publiée peut casser sans qu'aucun commit ne l'ait touchée :
# expiration d'artefact, changement d'en-têtes chez l'hébergeur, branche
# gh-pages écrasée.
name: Vérifier la sandbox publiée

# Cette recette ne fait que lire : elle clone le dépôt et pointe un
# navigateur vers une URL publique. Sans ce bloc, elle héritait des
# permissions par défaut du dépôt — un jeton en écriture pour un job
# qui n'écrit rien, et qui exécute pourtant du code tiers (npm ci,
# binaires Playwright).
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      url:
        description: >-
          URL de la sandbox à vérifier. Vide = la démonstration de référence
          (https://pinfada.github.io/railsbox-demo/).
        type: string
        required: false
        default: ""
      moteurs:
        description: >-
          Moteurs de navigateur à vérifier. « chromium » (défaut), une liste
          « chromium,firefox », ou « tous ». Firefox et WebKit sont mesurés
          fonctionnels mais restent hors du passage hebdomadaire : ils
          triplent la durée pour un verdict que Chromium rend déjà.
        type: string
        required: false
        default: "chromium"
  schedule:
    # Lundi 06:00 UTC : la semaine commence sur un verdict frais.
    - cron: "0 6 * * 1"

jobs:
  recette:
    runs-on: ubuntu-latest
    # Boot de VM émulée derrière un GitHub Pages : large, sans être infini.
    timeout-minutes: 20
    # Le passage hebdomadaire n'a pas d'entrées : Chromium par défaut.
    env:
      RAILSBOX_MOTEURS: ${{ inputs.moteurs || 'chromium' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer les moteurs demandés
        run: |
          if [ "$RAILSBOX_MOTEURS" = "tous" ] || [ "$RAILSBOX_MOTEURS" = "all" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            # Tableau plutôt qu'expansion nue : une liste « firefox,webkit »
            # doit devenir deux arguments, pas un mot découpé au hasard.
            IFS=',' read -r -a moteurs <<< "$RAILSBOX_MOTEURS"
            npx playwright install --with-deps "${moteurs[@]}"
          fi
      - name: Recette en ligne
        env:
          RAILSBOX_SANDBOX_URL: ${{ inputs.url }}
        run: npm run test:live
      - name: Captures d'écran des échecs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: captures-recette
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
