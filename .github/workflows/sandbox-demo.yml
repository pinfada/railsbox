# Appelle le workflow réutilisable sur l'application de démonstration du dépôt.
#
# C'est le banc d'essai de « Construire la sandbox » : railsbox joue ici le rôle
# d'un mainteneur ordinaire, avec sa propre application Rails. Ce qui casse ici
# casserait chez lui.
name: Sandbox de démonstration

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier la sandbox"
        type: boolean
        default: true
      target-repo:
        description: >-
          Dépôt PUBLIC où publier. railsbox étant privé, Pages n'y servirait
          rien : la démonstration vit donc ailleurs.
        type: string
        default: "pinfada/railsbox-demo"
      railsbox-ref:
        description: "Version de railsbox utilisée pour construire"
        type: string
        default: "main"

jobs:
  demo:
    uses: ./.github/workflows/construire-sandbox.yml
    permissions:
      contents: write
    with:
      app-path: tools/demo-app/demo
      name: demo
      railsbox-ref: ${{ inputs.railsbox-ref }}
      publish: ${{ inputs.publish }}
      target-repo: ${{ inputs.target-repo }}
    secrets:
      publish-key: ${{ secrets.PUBLISH_DEPLOY_KEY }}
