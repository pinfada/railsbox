# Construit et publie l'image de BASE railsbox sur GHCR.
#
# La base est un artefact central, immuable et versionné (ADR 0004) : elle est
# partagée par toutes les sandboxes, et le runner de chaque mainteneur la tire
# de GHCR pour construire son disque applicatif. On ne réécrit donc jamais un
# tag déjà consommé — une correction produit une nouvelle version.
#
# Mesuré le 2026-08-16 : ~4 min sur un runner ubuntu-latest. L'i386 n'est pas
# émulé (le CPU x86-64 exécute nativement un userland 32 bits), la construction
# tourne donc à pleine vitesse.
name: Publier la base

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Version publiée sur GHCR (jamais réécrire un tag déjà consommé).
          Convention : « <série Ruby> » pour la première base d'une série,
          puis « <série Ruby>-r<N> » pour ses révisions successives — 3.3 vaut
          donc r1. Une révision paraît dès que le CONTENU de la base change
          (paquet ajouté, script d'init modifié) : les artefacts sont immuables
          et les sandboxes déjà publiées continuent d'épingler l'ancienne.
        required: true
        default: "3.3-r2"
      ruby:
        description: >-
          Version exacte de Ruby compilée dans la base. À REPORTER dans
          BASE_RUBY_VERSIONS (tools/detect/bases.mjs) : c'est cette table qui
          permet à la détection de refuser AVANT la construction un Gemfile
          dont la directive `ruby` exclut ce patch. Une base absente de la
          table ne casse rien, elle désactive seulement la vérification.
        required: true
        default: "3.3.12"
      assets-repo:
        description: "Dépôt PUBLIC hébergeant les artefacts (Pages y est gratuit)"
        required: true
        default: "pinfada/railsbox-assets"
      push:
        description: "Publier (sinon construction et vérifications seules)"
        type: boolean
        default: true
      overwrite:
        description: "Réécrire une version DÉJÀ publiée — des sandboxes peuvent l'épingler"
        type: boolean
        default: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Les artefacts partent vers un AUTRE dépôt, par clé de déploiement :
      # le jeton du workflow n'a besoin que de lire ce dépôt-ci et d'écrire
      # sur GHCR.
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/railsbox-base
    steps:
      - uses: actions/checkout@v4

      - name: Construction de la base i386
        run: |
          set -o pipefail
          start=$(date +%s)
          docker build --platform linux/386 --progress=plain \
            --build-arg "RUBY_VERSION=${{ inputs.ruby }}" \
            --build-arg "BASE_NAME=base-${{ inputs.tag }}" \
            --build-arg "WITH_REDIS=1" \
            -f tools/build-v86-image/base/Dockerfile \
            -t "$IMAGE:${{ inputs.tag }}" \
            tools/build-v86-image/base 2>&1 | tee /tmp/base.log | tail -25
          echo "## Base construite en $(( ($(date +%s) - start) / 60 )) min" >> "$GITHUB_STEP_SUMMARY"

      # Garde-fou du correctif linux32 : sans la personnalité 32 bits, les
      # binaires restent corrects mais Ruby s'étiquette « x86_64-linux-x32 »,
      # une plateforme fantôme qui fausse la résolution de RubyGems. On refuse
      # de publier une base dans cet état.
      - name: Vérification de l'architecture déclarée
        run: |
          plateforme=$(docker run --rm --platform linux/386 "$IMAGE:${{ inputs.tag }}" \
            ruby -e 'print RUBY_PLATFORM')
          # xargs replie les espaces multiples ET retire ceux des extrémités :
          # sans cela la valeur garde une espace de tête et aucun motif ne colle.
          classe=$(docker run --rm --platform linux/386 "$IMAGE:${{ inputs.tag }}" \
            readelf -h /usr/local/bin/ruby | grep -E '^ +(Class|Machine):' | cut -d: -f2 | xargs)
          {
            echo "| Contrôle | Valeur |"
            echo "|---|---|"
            echo "| \`RUBY_PLATFORM\` | \`${plateforme}\` |"
            echo "| ELF de \`/usr/local/bin/ruby\` | \`${classe}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$plateforme" != "i686-linux" ]; then
            echo "::error::RUBY_PLATFORM vaut « ${plateforme} », attendu « i686-linux » — la personnalité linux32 n'a pas pris."
            exit 1
          fi
          case "$classe" in
            *ELF32*80386*) echo "Binaire ELF32 / Intel 80386 : exécutable par le CPU émulé de v86." ;;
            *) echo "::error::Binaire inattendu (${classe}) : v86 émule un i386, il lui faut de l'ELF32."; exit 1 ;;
          esac

      - name: Vérification du contenu attendu de la base
        run: |
          docker run --rm --platform linux/386 "$IMAGE:${{ inputs.tag }}" sh -c '
            set -eu
            ruby -v
            test -x /opt/rib/guest-init.sh
            test -x /opt/rib/start-app.sh
            test -x /opt/rib/postgres.sh
            test -f /opt/rib/postgresql-railsbox.conf
            test -f /opt/rib/serial-bridge.py
            test -f /opt/rib/config.ru
            test -d /app
            ls /boot/vmlinuz-* >/dev/null
            python3 --version
            redis-server --version | head -1
            /usr/lib/postgresql/15/bin/postgres --version
          '

      # PostgreSQL doit être présent EN BINAIRES et ABSENT EN CLUSTER. Un
      # datadir dans le rootfs mutualisé serait un défaut de fond : il pèserait
      # sur tous les visiteurs, y compris ceux dont l'application n'utilise pas
      # PostgreSQL, et offrirait une seconde base dans laquelle une application
      # pourrait atterrir au lieu de la sienne, sur son disque applicatif.
      - name: Vérification de l'absence de cluster dans le rootfs
        run: |
          docker run --rm --platform linux/386 "$IMAGE:${{ inputs.tag }}" sh -c '
            set -eu
            if [ -d /var/lib/postgresql/15/main ]; then
              echo "cluster par défaut présent dans le rootfs mutualisé"; exit 1
            fi
            test ! -d /etc/postgresql/15/main
          '

      # Preuve que le cluster d'une sandbox peut réellement naître dans la base :
      # initdb complet, démarrage, arrêt propre. C'est le chemin que suivra le
      # build de chaque disque applicatif PostgreSQL — mieux vaut le casser ici
      # que dans la CI d'un mainteneur.
      - name: Répétition du cycle de vie PostgreSQL
        run: |
          docker run --rm --platform linux/386 \
            -e PGDATA=/tmp/pgtest -e RIB_PG_VERSION=15 \
            "$IMAGE:${{ inputs.tag }}" sh -c '
              set -eu
              mkdir -p /tmp/pgtest
              sh /opt/rib/postgres.sh start
              su -s /bin/sh postgres -c "psql -h 127.0.0.1 -U postgres -d postgres -qtAc \
                \"select version();\"" | head -1
              sh /opt/rib/postgres.sh stop
            '

      # ------------------------------------------------------------------
      # Artefacts navigateur, extraits de L'IMAGE QUI VIENT D'ÊTRE VÉRIFIÉE.
      # Les reconstruire séparément donnerait un ext2 différent (UUID,
      # horodatages) de celui dont dérive l'image publiée : les deux faces de
      # la base doivent sortir du même build.
      # ------------------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Extraction du rootfs et fabrication de l'ext2
        run: |
          sudo bash tools/build-v86-image/base/base-build.sh \
            --image "$IMAGE:${{ inputs.tag }}" \
            --name "base-${{ inputs.tag }}"
          # base-build.sh tourne en root pour préserver les uid : les étapes
          # Node qui suivent doivent pouvoir écrire dans public/disks.
          sudo chown -R "$USER" public/disks
          ls -la public/disks

      - name: Capture de l'instantané de base
        run: node tools/build-v86-image/make-base-snapshot.mjs --base "base-${{ inputs.tag }}"

      # Un répertoire PAR VERSION : c'est ce qui rend l'immutabilité de l'ADR
      # 0004 réelle. Une démonstration épinglée sur base-3.3 continue de
      # fonctionner le jour où base-3.4 paraît, puisqu'elles coexistent.
      - name: Découpage en morceaux zstd
        run: |
          version="base-${{ inputs.tag }}"
          node tools/build-v86-image/split-artifact.mjs \
            "public/disks/${version}.ext2" --zstd --out "publication/${version}"
          cp "public/disks/${version}-vmlinuz" "publication/${version}/"
          cp "public/disks/${version}-initrd" "publication/${version}/"
          # L'instantané de base ne sert PAS au visiteur (il restaure le delta
          # de l'application) : il n'est consommé que par la CI d'un mainteneur,
          # au moment de capturer ce delta. Un seul fichier gzippé suffit donc,
          # sous la limite de 95 Mo de Pages.
          cp "public/disks/${version}-state.bin.gz" "publication/${version}/"
          # L'ext2 pèse 1,4 Go : inutile de le garder sur le disque du runner.
          rm -f "public/disks/${version}.ext2"
          du -sh "publication/${version}"
          find "publication/${version}" -type f | wc -l

      # Preuve que les morceaux publiés reconstituent bien l'artefact d'origine.
      # Sans elle, une corruption ne se verrait qu'au boot d'un visiteur.
      - name: Vérification du réassemblage
        run: |
          version="base-${{ inputs.tag }}"
          node tools/build-v86-image/assemble-artifact.mjs \
            "publication/${version}/${version}.ext2.zst" --out /tmp/verif.ext2
          attendu=$(node -p "require('./publication/${version}/${version}.ext2-parts.json').totalBytes")
          obtenu=$(stat -c%s /tmp/verif.ext2)
          echo "réassemblé : ${obtenu} octets, attendu ${attendu}"
          [ "$obtenu" = "$attendu" ] || { echo "::error::Réassemblage incohérent."; exit 1; }
          rm -f /tmp/verif.ext2

      - name: Publication sur GHCR
        if: ${{ inputs.push }}
        env:
          # Jamais interpolé dans le texte du script : le shell le lit comme
          # une donnée, et il ne peut pas fuiter dans une ligne de commande.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ inputs.tag }}"
          echo "DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ inputs.tag }}" 2>/dev/null || echo -)" >> "$GITHUB_ENV"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ inputs.tag }}" 2>/dev/null || echo "-")
          {
            echo "## Publiée"
            echo ""
            echo "\`$IMAGE:${{ inputs.tag }}\`"
            echo ""
            echo "Empreinte : \`${digest}\`"
            echo ""
            echo "Le workflow du mainteneur épingle cette empreinte plutôt que le tag."
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Face navigateur : dépôt PUBLIC dédié aux artefacts.
      #
      # Pourquoi un dépôt séparé : le dépôt d'artefacts est un pur hébergeur
      # statique, et les centaines de mégaoctets de binaires ne polluent pas
      # l'historique du code.
      #
      # Publication ADDITIVE : on récupère l'état publié, on y ajoute (ou
      # remplace) le répertoire de CETTE version, puis on écrase l'historique
      # par un commit unique contenant TOUT. Les versions coexistent — condition
      # de l'immutabilité promise par l'ADR 0004 — et l'historique ne grossit
      # jamais, alors qu'une branche orpheline naïve effacerait les versions
      # précédentes et casserait les démonstrations qui les épinglent.
      # ------------------------------------------------------------------
      - name: Publication des artefacts sur le dépôt d'assets
        if: ${{ inputs.push }}
        env:
          DEPLOY_KEY: ${{ secrets.ASSETS_DEPLOY_KEY }}
          ASSETS_REPO: ${{ inputs.assets-repo }}
        run: |
          set -eu
          version="base-${{ inputs.tag }}"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          distant="git@github.com:${ASSETS_REPO}.git"
          git clone --depth 1 --branch gh-pages "$distant" publie 2>/dev/null || {
            echo "Aucune branche gh-pages : première publication."
            mkdir -p publie && git -C publie init -q -b gh-pages
            git -C publie remote add origin "$distant"
          }

          # Garde d'immutabilité : une version déjà publiée ne se réécrit pas,
          # des sandboxes l'épinglent peut-être déjà.
          if [ -d "publie/$version" ] && [ "${{ inputs.overwrite }}" != "true" ]; then
            echo "::error::$version est déjà publiée. Utilisez une nouvelle version, ou cochez overwrite en connaissance de cause."
            exit 1
          fi

          rm -rf "publie/$version"
          cp -r "publication/$version" "publie/$version"
          touch publie/.nojekyll
          node tools/build-v86-image/ecrire-index-assets.mjs publie > publie/index.html

          cd publie
          git config user.email "actions@github.com"
          git config user.name "railsbox CI"
          # Commit unique : l'arbre complet est reposé à chaque publication, donc
          # l'historique reste plat tout en conservant toutes les versions.
          git checkout -q --orphan publication-plate
          git add -A
          git commit -q -m "artefacts railsbox — ${version} (railsbox@${{ github.sha }})"
          git branch -M gh-pages
          git push -f origin gh-pages
          echo "versions publiées : $(ls -d */ 2>/dev/null | tr -d / | tr '\n' ' ')"

      - name: Récapitulatif
        if: ${{ inputs.push }}
        run: |
          proprietaire="${{ inputs.assets-repo }}"
          racine="https://${proprietaire%%/*}.github.io/${proprietaire##*/}/base-${{ inputs.tag }}"
          {
            echo "## Base ${{ inputs.tag }} publiée"
            echo ""
            echo "| Face | Adresse |"
            echo "|---|---|"
            echo "| Image de construction | \`$IMAGE:${{ inputs.tag }}\` |"
            echo "| Empreinte | \`${DIGEST:--}\` |"
            echo "| Rootfs (morceaux zstd) | \`${racine}/base-${{ inputs.tag }}.ext2.zst\` |"
            echo "| Noyau | \`${racine}/base-${{ inputs.tag }}-vmlinuz\` |"
            echo "| Initrd | \`${racine}/base-${{ inputs.tag }}-initrd\` |"
            echo "| Instantané de base (CI mainteneur) | \`${racine}/base-${{ inputs.tag }}-state.bin.gz\` |"
            echo ""
            echo "Le visiteur ne lit que les morceaux, le noyau et l'initrd —"
            echo "v86 dérive le nom du morceau contenant l'offset demandé."
            echo "L'instantané de base ne sert qu'à capturer un delta applicatif."
          } >> "$GITHUB_STEP_SUMMARY"
