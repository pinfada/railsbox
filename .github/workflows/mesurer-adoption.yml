# Capture hebdomadaire de l'adoption, écrite dans le dépôt.
#
# POURQUOI UNE CAPTURE. L'API de trafic de GitHub n'expose que QUATORZE JOURS.
# Chaque semaine non capturée est définitivement perdue : il n'existe aucun
# moyen de la reconstituer après coup. En committant la mesure, l'historique
# git devient la série temporelle — sans base de données, sans service, et
# publiable puisque le dépôt est public.
#
# CE QU'ELLE NE MESURERA JAMAIS. Un dépôt PRIVÉ qui utilise railsbox est
# invisible : aucune recherche ne le voit, aucun compteur ne le distingue. Ce
# n'est pas un manque d'outillage, c'est le modèle — pas de serveur, pas de
# compte, pas de télémétrie. La page générée l'écrit noir sur blanc plutôt que
# de laisser croire à un recensement.
#
# AUCUN VISITEUR N'EST MESURÉ ICI. On lit le trafic de NOTRE dépôt et le
# compteur de NOTRE image de base. Personne n'est pisté, et la sandbox d'un
# tiers ne rapporte rien à personne — le badge est servi par sa propre
# publication, jamais par nous.
name: Mesurer l'adoption

on:
  schedule:
    # Lundi 07:00 UTC, après la vérification de la sandbox publiée : deux
    # relevés hebdomadaires groupés au même moment se relisent ensemble.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  mesurer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collecte
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # MÊME collecteur qu'en local (npm run adoption) : deux
          # implémentations divergeraient, et celle qui tourne le moins serait
          # fausse la première. Le jeton d'Actions ne portant PAS la recherche
          # de code sur l'ensemble de GitHub, la liste des sandboxes publiques
          # sera vide ici — la vision complète s'obtient depuis un poste, sans
          # avoir à déposer un jeton personnel à portée large dans les secrets
          # d'un dépôt public. Le collecteur le dit sur sa sortie d'erreur.
          node tools/collecter-adoption.mjs
          cat docs/adoption.md

      - name: Consigner la mesure
        run: |
          set -eu
          git config user.email "actions@github.com"
          git config user.name "railsbox"
          git add docs/adoption.md
          # Rien de neuf : pas de commit vide. Une semaine identique à la
          # précédente est une information, mais pas un commit.
          if git diff --cached --quiet; then
            echo "Aucun changement mesuré cette semaine."
            exit 0
          fi
          git commit -m "chore: mesure d'adoption du $(date -u '+%d/%m/%Y')"
          git push
