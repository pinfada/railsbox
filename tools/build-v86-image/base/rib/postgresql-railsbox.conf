# Réglages railsbox ajoutés à la fin du postgresql.conf produit par initdb.
# Ils décrivent un cluster de DÉMONSTRATION jetable tournant dans une VM émulée,
# pas un serveur de production : chaque visiteur en a sa copie, qui disparaît
# avec l'onglet (voir SECURITY.md).

# Loopback uniquement. La VM n'a aucun réseau sortant et le pont série est le
# seul canal vers le navigateur : rien ne peut joindre ce port de l'extérieur.
listen_addresses = '127.0.0.1'
port = 5432
unix_socket_directories = '/var/run/postgresql'

# L'émulateur ne dispose que d'un cœur et d'un gigaoctet : chaque mégaoctet
# rendu à Ruby est un mégaoctet qui ne part pas en swap. Le pool d'ActiveRecord
# vaut RAILS_MAX_THREADS (4) — dix connexions laissent de la marge.
max_connections = 10
shared_buffers = 24MB
work_mem = 1MB
maintenance_work_mem = 16MB

# PostgreSQL 15 réclame /dev/shm, monté par l'init du guest.
dynamic_shared_memory_type = posix

# Durabilité désactivée : la base est reconstruite à chaque build et le disque
# du visiteur est jetable. Sous émulation, fsync coûte l'essentiel du temps des
# migrations et des seeds — pour une garantie qui ne protège rien ici.
fsync = off
synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0

# Le pont série relaie les journaux vers le navigateur : on ne garde que ce qui
# aide vraiment à diagnostiquer un démarrage raté.
log_min_messages = warning
log_line_prefix = '[postgres] '
logging_collector = off
